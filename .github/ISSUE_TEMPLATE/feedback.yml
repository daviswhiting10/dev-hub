name: Briefing feedback
description: Votes sent from the Dev Hub Briefing page. Submitted automatically; you should not need to edit anything.
title: "[hub-feedback] Votes"
body:
  - type: markdown
    attributes:
      value: |
        Prefilled by the site. Press **Submit new issue**. A workflow records the votes in `data/feedback.js`, and the Critic agent uses them to tune tomorrow's briefing.
  - type: textarea
    id: payload
    attributes:
      label: Payload
      description: JSON generated by the site (do not edit).
    validations:
      required: true
