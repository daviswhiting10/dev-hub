name: daily-briefing

# Runs the research agents (agents/run.mjs) every morning and commits the resulting data files.
# Requires the repo secret ANTHROPIC_API_KEY. Without it the job exits cleanly with a warning (no failures, no spend).
on:
  schedule:
    - cron: "7 9 * * *"         # 5:07 AM US Eastern during daylight time (EDT = UTC-4)
    - cron: "7 10 * * *"        # 5:07 AM US Eastern during standard time (EST = UTC-5); the gate job skips whichever is off by an hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use canned fixtures and commit nothing"
        type: boolean
        default: false
      force:
        description: "Regenerate today's briefing if it already exists"
        type: boolean
        default: false

permissions:
  contents: write     # commit the data files
  pages: write        # request a Pages rebuild after committing

concurrency:
  group: hub-data     # shared with ingest-feedback so the two never push at the same time
  cancel-in-progress: false

jobs:
  gate:
    # GitHub cron is UTC-only, so we fire at both possible UTC hours and let only the one matching 05:xx US Eastern
    # (Columbia, MD) continue. This keeps the schedule right across daylight-saving changes.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        run: |
          h=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$h" = "05" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Local hour is $h; skipping."; fi

  briefing:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Agent tests
        run: node agents/test.mjs

      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; skipping the run. Add it with: gh secret set ANTHROPIC_API_KEY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run research agents
        if: steps.key.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          TOKEN_BUDGET: ${{ vars.TOKEN_BUDGET }}
        run: node agents/run.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Verify only whitelisted data files changed
        if: steps.key.outputs.run == 'true' && inputs.dry_run != true
        run: |
          bad=$(git status --porcelain | awk '{print $2}' | grep -Ev '^data/(briefings/[0-9]{4}-[0-9]{2}-[0-9]{2}\.js|briefings/index\.js|strategy\.js|poll\.js)$' || true)
          if [ -n "$bad" ]; then echo "::error::Unexpected files changed:"; echo "$bad"; exit 1; fi

      - name: Commit and push
        if: steps.key.outputs.run == 'true' && inputs.dry_run != true
        run: |
          git config user.name "dev-hub-agents"
          git config user.email "dev-hub-agents@users.noreply.github.com"
          git add data/briefings data/strategy.js data/poll.js
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily briefing $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Ask GitHub Pages to rebuild
        if: steps.key.outputs.run == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages rebuild request failed (it may still rebuild on push)."
