name: ingest-feedback

# Turns a poll / feedback issue (opened from the site by the repository owner) into data/profile.js / data/feedback.js.
# Safety: runs only for the repo owner, never interpolates issue text into a shell command, and agents/ingest.mjs
# validates every field before writing a whitelisted file.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: hub-data
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.actor == github.repository_owner &&
      (startsWith(github.event.issue.title, '[hub-poll]') || startsWith(github.event.issue.title, '[hub-feedback]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ingest
        id: ingest
        run: |
          if node agents/ingest.mjs --event "$GITHUB_EVENT_PATH" > ingest.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat ingest.log

      - name: Commit and push
        if: steps.ingest.outputs.ok == 'true'
        run: |
          git config user.name "dev-hub-agents"
          git config user.email "dev-hub-agents@users.noreply.github.com"
          git add data/profile.js data/feedback.js
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Ingest issue #${{ github.event.issue.number }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body-file ingest.log
          gh issue close "$NUM" --reason completed

      - name: Ask GitHub Pages to rebuild
        if: steps.ingest.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages rebuild request failed."
